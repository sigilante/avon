# make check on every push to master and every pull request: the release
# binary and its smoke test, the stats build, and every unit test under
# ASan and UBSan, on Linux; pushes to master also run it on macOS.  A push
# or pull request that changes only documentation (Markdown, docs/, img/,
# LICENSE) runs nothing: no build or test reads those files.  The
# checks against SKIjack, SKIlark and lean-ski (witness-check,
# jet-witness-check, probe-witness-check, zk-jet-witness-check,
# p2-witness-check, words-lean-check, templates-lean-check,
# fix-lean-check, interp-lean-check, jets-lean-check) run weekly at their pins (pinned.yml); hider-check,
# which needs the paper's scripts, stays manual: see the Makefile's header.
#
# Pinned: the images, the compiler (the image's clang-18 on Linux, Xcode
# 16.4's clang on macOS), and each action by commit.
name: check

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "img/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "img/**"
      - "LICENSE"

# Linux on every push and pull request; macOS, billed at ten times the
# rate on a private repository, only on pushes to master.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-24.04", "macos-15"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CC: ${{ startsWith(matrix.os, 'macos') && 'clang' || 'clang-18' }}
      DEVELOPER_DIR: ${{ startsWith(matrix.os, 'macos') && '/Applications/Xcode_16.4.app/Contents/Developer' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: clang version
        run: $CC --version
      - name: release build
        run: make -j4 CC=$CC build/avon
      - name: release smoke test
        run: make CC=$CC smoke
      - name: stats build
        run: make -j4 CC=$CC stats
      - name: unit tests under ASan and UBSan
        run: make -j4 CC=$CC check
