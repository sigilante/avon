# make check on every push to master and every pull request: the release
# binary and its smoke test, the stats build, and every unit test under
# ASan and UBSan, on Linux; pushes to master also run it on macOS.  The
# checks that need a lean-ski or skijack checkout (witness-check,
# zk-jet-witness-check, p2-witness-check, front0-check, selfhost-check,
# hider-check) stay manual: see the Makefile's header.
name: check

on:
  push:
    branches: [master]
  pull_request:

# Linux on every push and pull request; macOS, billed at ten times the
# rate on a private repository, only on pushes to master.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: clang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: clang version
        run: clang --version
      - name: release build
        run: make -j4 build/avon
      - name: release smoke test
        run: make smoke
      - name: stats build
        run: make -j4 stats
      - name: unit tests under ASan and UBSan
        run: make -j4 check
