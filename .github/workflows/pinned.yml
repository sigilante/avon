# The checks against other repositories, weekly, at the revisions
# tests/pins.sh pins: every fixture regenerates byte for byte from its
# exporter (make fixtures-check), and the selfhost, SKIjack-0 and
# full-language front-end checks pass against SKIjack; and, in a job of
# their own, the five witness checks pass against lean-ski.  The pure-S
# paper's scripts are a private repository; hider-check stays manual, and
# refuses a checkout off its pin.
name: pinned

on:
  schedule:
    - cron: "17 6 * * 1"            # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 360          # front1-check alone took 106 min on an M-series Mac
    env:
      CC: clang-18
      SKIJACK: ${{ github.workspace }}/ext/skijack
      SKILARK: ${{ github.workspace }}/ext/skilark
      AVIARY: ${{ github.workspace }}/ext/aviary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: pins
        id: pins
        run: |
          . tests/pins.sh
          echo "skijack=$SKIJACK_PIN" >> "$GITHUB_OUTPUT"
          echo "skilark=$SKILARK_PIN" >> "$GITHUB_OUTPUT"
          echo "aviary=$AVIARY_PIN" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: sigilante/SKIjack
          ref: ${{ steps.pins.outputs.skijack }}
          path: ext/skijack
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: sigilante/SKIlark
          ref: ${{ steps.pins.outputs.skilark }}
          path: ext/skilark
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: sigilante/aviary
          ref: ${{ steps.pins.outputs.aviary }}
          path: ext/aviary
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: aviary-kernel at its pin
        run: pip install ./ext/aviary
      - name: release build
        run: make -j4 CC=$CC build/avon
      - name: fixtures regenerate
        run: tests/fixtures_check.sh
      - name: selfhost check
        run: tests/selfhost_check.sh
      - name: SKIjack-0 front end
        run: tests/front0_check.sh
      - name: full-language front end
        run: tests/front1_check.sh

  # Avon's tables against lean-ski's checkers and prover, at lean-ski's pin:
  # make witness-check, jet-witness-check, probe-witness-check,
  # zk-jet-witness-check and p2-witness-check (docs/TESTING.md).
  lean-ski:
    runs-on: ubuntu-24.04
    timeout-minutes: 150          # a cold lean-ski build takes about 50 minutes
    env:
      CC: clang-18
      LEAN_SKI: ${{ github.workspace }}/ext/lean-ski
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: pins
        id: pins
        run: |
          . tests/pins.sh
          echo "lean-ski=$LEAN_SKI_PIN" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: sigilante/lean-ski
          ref: ${{ steps.pins.outputs.lean-ski }}
          path: ext/lean-ski
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # lean-ski's Ski.ZK.Generic peaks at about 11 GiB, so it builds alone,
      # with swap as the margin, as lean-ski's own CI builds it.
      - name: Swap, for lean-ski's Ski.ZK.Generic
        run: |
          sudo systemctl stop systemd-oomd || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - name: lean-ski's Ski.ZK.Generic, alone
        working-directory: ext/lean-ski
        run: lake build Ski.ZK.Generic
      - name: lean-ski's executables the checks run
        working-directory: ext/lean-ski
        run: lake build aircheck jets composed skilark circuit p2run
      - name: build
        run: make -j4 CC=$CC build/avon
      - name: witness check
        run: make CC=$CC witness-check
      - name: jet witness check
        run: make CC=$CC jet-witness-check
      - name: probe witness check
        run: make CC=$CC probe-witness-check
      - name: zk jet witness check
        run: make CC=$CC zk-jet-witness-check
      - name: p2 witness check
        run: make CC=$CC p2-witness-check
