# pins.conf: the pinned jets `avon reduce --pins` turns on, one per line:
#
#   KIND  TERM-FILE
#
# KIND names the native code (p2, nock-dec, hoon-dec); TERM-FILE is the term
# it stands for, in the DAG form, its path relative to this file.  Each term
# must have the full digest Avon pins for its kind, or Avon refuses it.  A
# line may be left out to leave that jet off.  `#` starts a comment.
#
# The terms here, and where they come from:
#   P.dag                  lean-ski e72fff0, `lake exe p2run 1 OUT`: Poseidon2's P
#   jetT-decF.dag          SKInock d89b96c, scripts/PinDec.lean: the Λ word dec
#   jetT-hoonDecBodyF.dag  SKInock fe3c031, scripts/PinDec.lean: Hoon's ++dec arm

p2        pins/P.dag
nock-dec  pins/jetT-decF.dag
hoon-dec  pins/jetT-hoonDecBodyF.dag
